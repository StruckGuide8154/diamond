<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Diamond Beauty</title><link rel="stylesheet" href="assets/css/style.css">
<style>
.admin-wrap{max-width:1100px;margin:60px auto;padding:0 20px}.admin-card{background:#fff;border:1px solid #e8e0da;border-radius:8px;padding:28px;margin-bottom:24px}.admin-login{max-width:420px;margin:80px auto}.admin-tabs{display:flex;gap:10px;margin:24px 0;flex-wrap:wrap}.admin-tabs button{padding:10px 22px;border:1px solid #b98;background:#fff;cursor:pointer;border-radius:30px;font-size:14px}.admin-tabs button.active{background:#7a2d3a;color:#fff;border-color:#7a2d3a}.rec{border-top:1px solid #eee;padding:16px 0}.rec:first-child{border-top:none}.rec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.rec p{margin:6px 0;color:#443;font-size:14px;white-space:pre-wrap}.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:#f3e8dd;margin-right:8px}.pill.new,.pill.paid{background:#7a2d3a;color:#fff}.rec-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.rec-actions button,.stock-row button{font-size:13px;padding:7px 14px;border:1px solid #ccc;background:#fff;border-radius:20px;cursor:pointer}.admin-msg{color:#7a2d3a;margin-top:12px;font-size:14px}#admin-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.stock-row{display:grid;grid-template-columns:1fr 110px 100px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #eee}.stock-row:first-child{border-top:none}.stock-row input{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px}.muted{color:#887;font-size:13px}@media(max-width:650px){.stock-row{grid-template-columns:1fr 90px}.stock-row button{grid-column:1/-1}}
</style></head><body>
<script src="assets/js/components.js"></script><script>header()</script>
<div class="admin-wrap">
<div id="setup-view" class="admin-card" style="display:none"><h2>Admin not configured</h2><p>Set <code>ADMIN_PASSWORD</code>, <code>SECRET_KEY</code> and <code>REDIS_URL</code> on Railway. <code>ADMIN_EMAIL</code> is optional.</p></div>
<div id="login-view" class="admin-card admin-login" style="display:none"><div class="eyebrow">Diamond Beauty</div><h2>Admin <span class="script">sign in.</span></h2><form class="form" id="login-form" style="margin-top:20px"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="username"><label for="a-pass">Password</label><input id="a-pass" type="password" required autocomplete="current-password"><button class="btn" type="submit" style="margin-top:18px">Sign in</button><div class="admin-msg" id="login-msg"></div></form></div>
<div id="dash-view" style="display:none"><div id="admin-bar"><h2>Clinic <span class="script">dashboard.</span></h2><button class="btn ghost" style="min-height:38px;padding:0 18px" id="signout">Sign out</button></div><div class="admin-tabs"><button data-tab="messages" class="active">Booking requests</button><button data-tab="orders">Orders</button><button data-tab="inventory">Stock control</button></div><div class="admin-card" id="records">Loading…</div></div>
</div>
<script>
const $=id=>document.getElementById(id);let tab='messages';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n||0))}
function fmtDate(ts){return ts?new Date(Number(ts)*1000).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):''}
async function api(url,opts={}){
  const res=await fetch(url,{...opts,headers:{Accept:'application/json',...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});
  let data={};try{data=await res.json()}catch(_){}
  if(!res.ok){const e=new Error(data.error||`Request failed (${res.status})`);e.status=res.status;throw e}
  return data;
}
function show(view){['setup-view','login-view','dash-view'].forEach(v=>$(v).style.display=v===view?'block':'none')}
async function load(){
  $('records').textContent='Loading…';
  try{
    if(tab==='inventory'){const data=await api('/api/admin/inventory');renderInventory(data.products||[]);return}
    const data=await api('/api/admin/'+tab);renderRecords(data.records||[]);
  }catch(err){if(err.status===401){show('login-view');return}$('records').textContent=err.message}
}
function renderRecords(rows){
  if(!rows.length){$('records').innerHTML='<p>Nothing here yet.</p>';return}
  $('records').innerHTML=rows.map(r=>{
    if(tab==='messages'){
      const actions=r.status==='new'?`<button onclick="setStatus('${r.id}','handled')">Mark handled</button>`:`<button onclick="setStatus('${r.id}','new')">Mark new</button>`;
      return `<div class="rec"><div class="rec-head"><b>${esc(r.name)}</b><span><span class="pill ${esc(r.status)}">${esc(r.status)}</span> <span class="muted">${fmtDate(r.created_at)}</span></span></div><p>${esc(r.email)}${r.phone?' · '+esc(r.phone):''}</p><p><span class="pill">${esc(r.treatment||'General')}</span></p><p>${esc(r.message||'')}</p><div class="rec-actions">${actions}<button onclick="removeRec('${r.id}')" style="color:#a33">Delete</button></div></div>`;
    }
    const items=(r.items||[]).map(i=>`${esc(i.name)} × ${i.qty} — ${money((i.price_pence||0)*i.qty/100)}`).join('<br>');
    let actions='';
    if(r.payment_status==='paid'&&r.status!=='fulfilled')actions+=`<button onclick="setStatus('${r.id}','fulfilled')">Mark fulfilled</button>`;
    if(r.payment_status!=='paid'&&!r.inventory_restored)actions+=`<button onclick="setStatus('${r.id}','cancelled')">Cancel & return stock</button>`;
    actions+=`<button onclick="setStatus('${r.id}','review')">Review</button><button onclick="removeRec('${r.id}')" style="color:#a33">Delete</button>`;
    return `<div class="rec"><div class="rec-head"><b>${esc(r.name)}</b><span><span class="pill ${esc(r.payment_status)}">${esc(r.payment_status)}</span><span class="pill">${esc(r.status)}</span> <span class="muted">${fmtDate(r.created_at)}</span></span></div><p>${esc(r.email)}${r.phone?' · '+esc(r.phone):''}</p><p>${items}</p><p><b>${money(r.total)}</b></p>${r.notes?`<p>${esc(r.notes)}</p>`:''}<p class="muted">Order ${esc(r.id)}${r.stripe_session_id?' · Stripe '+esc(r.stripe_session_id):''}</p><div class="rec-actions">${actions}</div></div>`;
  }).join('');
}
function renderInventory(products){
  $('records').innerHTML='<div class="eyebrow">Live Redis inventory</div>'+products.map(p=>`<div class="stock-row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.brand)} · ${money(p.price)}</div></div><input id="stock-${p.id}" type="number" min="0" step="1" value="${p.stock}"><button onclick="saveStock('${p.id}')">Save</button></div>`).join('');
}
window.saveStock=async id=>{const input=$('stock-'+id);const value=Number(input.value);try{await api('/api/admin/inventory/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({stock:value})});input.value=Math.max(0,Math.trunc(value))}catch(err){alert(err.message)}};
window.setStatus=async(id,status)=>{try{await api('/api/admin/'+tab+'/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}catch(err){alert(err.message)}};
window.removeRec=async id=>{if(!confirm('Delete this record permanently?'))return;try{await api('/api/admin/'+tab+'/'+id,{method:'DELETE'});load()}catch(err){alert(err.message)}};
document.querySelectorAll('.admin-tabs button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.admin-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');tab=btn.dataset.tab;load()});
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-msg').textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('a-email').value.trim(),password:$('a-pass').value})});show('dash-view');load()}catch(err){$('login-msg').textContent=err.message;if(err.status===503)show('setup-view')}});
$('signout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});show('login-view')};
(async()=>{try{const data=await api('/api/admin/session');if(data.authenticated){show('dash-view');load()}else show('login-view')}catch(err){show(err.status===503?'setup-view':'login-view')}})();
</script></body></html>
