# Pings the Supabase database every 3 days so the free-tier project
# is never paused for inactivity. Reads the connection details from
# assets/js/config.js (the anon key is public by design; row-level
# security limits what it can do). Does nothing until config.js is
# filled in.
name: Keep database awake
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]*' assets/js/config.js || true)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]*' assets/js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js not filled in yet — skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/messages?select=id&limit=1")
          echo "Supabase responded with HTTP $code"
          # 200 = ok; anything else means the DB needs attention
          [ "$code" = "200" ]
